query {
  repository(owner: "DNAKode", name: "vbnet-lsp") {
    pullRequest(number: 7) {
      reviewThreads(first: 20) {
        nodes {
          id
          isResolved
          comments(first: 1) {
            nodes {
              body
              author {
                login
              }
            }
          }
        }
      }
    }
  }
}
