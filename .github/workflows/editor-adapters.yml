name: editor-adapters

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  nvim-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache Neovim portable bundle
        uses: actions/cache@v4
        with:
          path: test-explore/clients/nvim/nvim
          key: nvim-win64-v0.11.0
      - name: Build language server (Debug)
        run: dotnet build src/VbNet.LanguageServer.Vb/VbNet.LanguageServer.Vb.vbproj -c Debug
      - name: Run Neovim smoke tests (VB.NET backend)
        shell: pwsh
        run: |
          test-explore/clients/nvim/run-tests.ps1 -Suite vbnet `
            -VbNetLspDll src\VbNet.LanguageServer.Vb\bin\Debug\net10.0\VbNet.LanguageServer.dll
      - name: Upload Neovim smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-smoke-logs
          path: |
            test-explore/clients/nvim/logs/*.log
            **/lsp.log
          if-no-files-found: ignore

  emacs-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache Emacs portable bundle
        uses: actions/cache@v4
        with:
          path: test-explore/clients/emacs/emacs
          key: emacs-win64-v29.4
      - name: Build language server (Debug)
        run: dotnet build src/VbNet.LanguageServer.Vb/VbNet.LanguageServer.Vb.vbproj -c Debug
      - name: Run Emacs eglot smoke tests (VB.NET backend)
        shell: pwsh
        run: |
          test-explore/clients/emacs/run-tests.ps1 -Suite vbnet `
            -VbNetLspDll src\VbNet.LanguageServer.Vb\bin\Debug\net10.0\VbNet.LanguageServer.dll

  zed-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Zed readiness gates
        shell: pwsh
        run: scripts/verify-zed-readiness.ps1
      - name: Verify Zed release pin on tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          scripts/verify-zed-readiness.ps1 -Version $version
      - name: Export Zed adapter dry run
        shell: pwsh
        run: |
          adapters/scripts/export-adapter-repos.ps1 `
            -ZedRepoPath "$env:RUNNER_TEMP\vbnet-zed" `
            -TreeSitterRepoPath "$env:RUNNER_TEMP\tree-sitter-vbnet" `
            -Clean `
            -DryRun
      - name: Export Zed adapter contents
        shell: pwsh
        run: |
          adapters/scripts/export-adapter-repos.ps1 `
            -ZedRepoPath "$env:RUNNER_TEMP\vbnet-zed" `
            -TreeSitterRepoPath "$env:RUNNER_TEMP\tree-sitter-vbnet" `
            -Clean
          foreach ($required in @(
            'extension.toml',
            'Cargo.toml',
            'Cargo.lock',
            '.gitignore',
            'LICENSE',
            'src/lib.rs',
            'src/server.rs',
            'src/debug.rs',
            'src/platform.rs',
            'src/workspace.rs',
            'debug_adapter_schemas/netcoredbg.json',
            'languages/vbnet/config.toml',
            'languages/vbnet/brackets.scm',
            'languages/vbnet/folds.scm',
            'languages/vbnet/highlights.scm',
            'languages/vbnet/indents.scm',
            'languages/vbnet/outline.scm',
            'languages/vbnet/overrides.scm',
            'languages/vbnet/semantic_token_rules.json',
            'languages/vbnet/textobjects.scm',
            'README.md',
            'MIRRORING.md'
          )) {
            $path = Join-Path "$env:RUNNER_TEMP\vbnet-zed" $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Exported Zed adapter is missing $required"
            }
          }
          foreach ($forbidden in @(
            'extension.wasm',
            'grammars',
            'target'
          )) {
            $path = Join-Path "$env:RUNNER_TEMP\vbnet-zed" $forbidden
            if (Test-Path -LiteralPath $path) {
              throw "Exported Zed adapter contains generated/cache path $forbidden"
            }
          }
          foreach ($required in @(
            'grammar.js',
            'package.json',
            'README.md',
            'LICENSE',
            'MIRRORING.md',
            'src/grammar.json',
            'src/node-types.json',
            'src/parser.c'
          )) {
            $path = Join-Path "$env:RUNNER_TEMP\tree-sitter-vbnet" $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Exported Tree-sitter grammar is missing $required"
            }
          }
          foreach ($forbidden in @(
            'parser.obj',
            'node_modules',
            'target'
          )) {
            $path = Join-Path "$env:RUNNER_TEMP\tree-sitter-vbnet" $forbidden
            if (Test-Path -LiteralPath $path) {
              throw "Exported Tree-sitter grammar contains generated/cache path $forbidden"
            }
          }
      - name: Check exported Zed adapter
        shell: pwsh
        working-directory: ${{ runner.temp }}/vbnet-zed
        run: cargo check --target wasm32-wasip1
