name: publish-vsix

on:
  workflow_dispatch:
    inputs:
      target:
        description: "VSIX target (defaults to win32-x64)"
        type: choice
        required: true
        default: win32-x64
        options:
          - win32-x64
          - linux-x64
          - darwin-x64
          - darwin-arm64
      pre_release:
        description: "Publish as pre-release"
        type: boolean
        required: true
        default: true

jobs:
  publish:
    runs-on: windows-latest
    environment: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/extension/package-lock.json

      - name: Install extension dependencies
        working-directory: src/extension
        run: npm ci

      - name: Package VSIX
        working-directory: src/extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run bundle-server
          npm run bundle-debugger -- --target "${{ inputs.target }}"
          npm run package
          $vsceArgs = @("package", "--target", "${{ inputs.target }}", "--out", "vbnet-language-support-${{ inputs.target }}.vsix")
          if ('${{ inputs.pre_release }}' -eq 'true') {
            $vsceArgs += "--pre-release"
          }
          npx vsce @vsceArgs

      - name: Publish VSIX
        working-directory: src/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $vsix = "vbnet-language-support-${{ inputs.target }}.vsix"
          if (-not (Test-Path $vsix)) {
            throw "VSIX not found at $vsix"
          }
          if ('${{ inputs.pre_release }}' -eq 'true') {
            npx vsce publish --pre-release --packagePath $vsix --pat $env:VSCE_PAT
          } else {
            npx vsce publish --packagePath $vsix --pat $env:VSCE_PAT
          }
